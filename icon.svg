<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="DSH 智能伙伴">
  <title>DSH 智能伙伴</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a84ff"/>
      <stop offset="1" stop-color="#1a4cd0"/>
    </linearGradient>
  </defs>

  <!-- 圆角徽章：浮在桌面上的一枚"伙伴"标记 -->
